# aimonitor – zentraler Stack.
#
#   cd deploy && cp .env.example .env && $EDITOR .env
#   docker compose up -d
#
# Die Agents laufen NICHT hier, sondern als systemd-Dienst auf den GPU-VMs:
# siehe deploy/agent/install.sh.

name: aimonitor

services:
  db:
    # TimescaleDB ist optional. Mit AIMON_DB_IMAGE=postgres:16-alpine läuft der
    # Server genauso, nur ohne Kompression und Chunk-Drop.
    image: ${AIMON_DB_IMAGE:-timescale/timescaledb:2.17.2-pg16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aimon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-aimon}
      # Für Zeitreihen deutlich wichtiger als die Defaults.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - work_mem=${PG_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-60}
      - -c
      - synchronous_commit=off
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aimon} -d ${POSTGRES_DB:-aimon}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Nach außen nicht nötig; zum Hineinschauen in .env AIMON_DB_PORT setzen.
    ports:
      - "${AIMON_DB_PORT:-127.0.0.1:5432}:5432"
    networks: [aimon]

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: aimonitor/server:${AIMON_VERSION:-0.1.0}
    # Dieses Image gibt es in keiner Registry - es wird hier gebaut.
    # Ohne pull_policy versucht `docker compose up -d` erst zu ziehen und
    # meldet "pull access denied", bevor es doch baut.
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AIMON_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-aimon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aimon}
      AIMON_BOOTSTRAP_TOKEN: ${AIMON_BOOTSTRAP_TOKEN:?AIMON_BOOTSTRAP_TOKEN muss gesetzt sein}
      AIMON_READ_TOKEN: ${AIMON_READ_TOKEN:-}
      AIMON_ALLOW_RAW_QUERIES: ${AIMON_ALLOW_RAW_QUERIES:-false}
      AIMON_RAW_QUERY_RETENTION_DAYS: ${AIMON_RAW_QUERY_RETENTION_DAYS:-2}
      AIMON_RAW_RETENTION_DAYS: ${AIMON_RAW_RETENTION_DAYS:-14}
      AIMON_ROLLUP_1M_DAYS: ${AIMON_ROLLUP_1M_DAYS:-90}
      AIMON_ROLLUP_1H_DAYS: ${AIMON_ROLLUP_1H_DAYS:-730}
      AIMON_REQUESTS_RETENTION_DAYS: ${AIMON_REQUESTS_RETENTION_DAYS:-30}
      AIMON_EVENTS_RETENTION_DAYS: ${AIMON_EVENTS_RETENTION_DAYS:-180}
      AIMON_STALE_AFTER_S: ${AIMON_STALE_AFTER_S:-90}
      AIMON_RATE_LIMIT_PER_MIN: ${AIMON_RATE_LIMIT_PER_MIN:-600}
      AIMON_GPU_TEMP_WARN_C: ${AIMON_GPU_TEMP_WARN_C:-83}
      AIMON_GPU_TEMP_CRIT_C: ${AIMON_GPU_TEMP_CRIT_C:-88}
      AIMON_TTFT_WARN_MS: ${AIMON_TTFT_WARN_MS:-2000}
      AIMON_TTFT_CRIT_MS: ${AIMON_TTFT_CRIT_MS:-8000}
      AIMON_HEADROOM_WARN_PCT: ${AIMON_HEADROOM_WARN_PCT:-20}
      AIMON_BLOCK_RATE_WARN_PCT: ${AIMON_BLOCK_RATE_WARN_PCT:-25}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${AIMON_BIND:-0.0.0.0}:${AIMON_PORT:-8420}:8420"
    networks: [aimon]
    # Der Server schreibt nichts ins Dateisystem außer /tmp.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  db-data:

networks:
  aimon:
    driver: bridge
