name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Agent (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum
      - name: Format prüfen
        run: |
          cd agent
          test -z "$(gofmt -l .)" || { echo "nicht formatiert:"; gofmt -l .; exit 1; }
      - name: go vet
        run: cd agent && go vet ./...
      - name: Tests mit Race-Detector
        run: cd agent && go test ./... -race -count=1
      - name: Statisch bauen
        run: |
          cd agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/aimon-agent .
          file /tmp/aimon-agent | grep -q 'statically linked'

  python:
    name: Server (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aimon
          POSTGRES_PASSWORD: aimon
          POSTGRES_DB: aimon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aimon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r server/requirements-dev.txt
      - name: Tests
        env:
          AIMON_TEST_DATABASE_URL: postgresql://aimon:aimon@localhost:5432/aimon_test
        run: cd server && python -m pytest -q

  web:
    name: Web-UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript-Syntax prüfen
        run: |
          for f in $(find web/js -name '*.js'); do
            node --check "$f" || exit 1
          done
          echo "alle Module syntaktisch in Ordnung"

  compose:
    name: Compose-Datei und Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose config validieren
        run: |
          cd deploy
          cp .env.example .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci|' .env
          sed -i 's|^AIMON_BOOTSTRAP_TOKEN=.*|AIMON_BOOTSTRAP_TOKEN=ci|' .env
          docker compose config > /dev/null
      - name: Server-Image bauen
        run: docker build -f server/Dockerfile -t aimonitor/server:ci .

  shell:
    name: install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n deploy/agent/install.sh
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./deploy/agent
          severity: warning
